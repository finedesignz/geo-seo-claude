<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Schema-Rich Page — Multiple JSON-LD Blocks</title>
  <meta name="description" content="A page with rich structured data for testing schema extraction.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Example Corp",
    "url": "https://example.com",
    "logo": "https://example.com/logo.png",
    "sameAs": [
      "https://twitter.com/example",
      "https://linkedin.com/company/example"
    ]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Example",
    "url": "https://example.com",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://example.com/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": "Test Article for Schema Extraction",
    "datePublished": "2025-01-01",
    "author": {
      "@type": "Person",
      "name": "Test Author"
    }
  }
  </script>
</head>
<body>
  <h1>Schema-Rich Page</h1>
  <p>This page contains multiple JSON-LD structured data blocks for testing schema extraction logic.</p>
  <article>
    <h2>Article Content</h2>
    <p>Content for the article schema.</p>
  </article>
</body>
</html>
